name: Terraform CI

on:
  push:
    branches:
      - feature

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform-plan:

    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Terraform
        run: terraform --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan